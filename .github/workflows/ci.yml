name: Checks
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/restore_git_mtimes.py
      - name: Identify toolchain
        run: python3 -c "import hashlib, subprocess; v = subprocess.run(['swift', '--version'], capture_output=True); print('SWIFT_ID=' + hashlib.sha256(v.stdout + v.stderr).hexdigest()[:16])" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6.1.0
        with:
          path: build/swiftpm
          key: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ github.sha }}
          restore-keys: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-
      - run: python3 -m venv build/schema-validation && build/schema-validation/bin/python -m pip install jsonschema
      - run: build/schema-validation/bin/python -B scripts/check.py
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            IntegrationAuthority/build/seed
            IntegrationAuthority/build/swiftpm
            IntegrationTests/build/seed
            IntegrationTests/build/swiftpm
          key: integration-v1-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ hashFiles('IntegrationAuthority/configs/bcr_authority.lock.json', 'IntegrationTests/configs/surface_plugins.lock.json', 'IntegrationAuthority/configs/authority_source_manager.py') }}-${{ github.sha }}
          restore-keys: integration-v1-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ hashFiles('IntegrationAuthority/configs/bcr_authority.lock.json', 'IntegrationTests/configs/surface_plugins.lock.json', 'IntegrationAuthority/configs/authority_source_manager.py') }}-
      - run: build/schema-validation/bin/python -B scripts/check_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ runner.os }}-${{ github.sha }}
          path: build/j5-integration
      - uses: actions/cache/save@v6.1.0
        if: success() && github.event_name == 'push'
        with:
          path: |
            IntegrationAuthority/build/seed
            IntegrationAuthority/build/swiftpm
            IntegrationTests/build/seed
            IntegrationTests/build/swiftpm
          key: integration-v1-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ hashFiles('IntegrationAuthority/configs/bcr_authority.lock.json', 'IntegrationTests/configs/surface_plugins.lock.json', 'IntegrationAuthority/configs/authority_source_manager.py') }}-${{ github.sha }}
      - uses: actions/cache/save@v6.1.0
        if: success() && github.event_name == 'push'
        with:
          path: build/swiftpm
          key: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ github.sha }}
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: python3 scripts/restore_git_mtimes.py
      - name: Identify toolchain
        run: python3 -c "import hashlib, subprocess; v = subprocess.run(['swift', '--version'], capture_output=True); print('SWIFT_ID=' + hashlib.sha256(v.stdout + v.stderr).hexdigest()[:16])" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v6.1.0
        with:
          path: build/swiftpm
          key: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ github.sha }}
          restore-keys: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-
      - run: python3 -m venv build/schema-validation && build/schema-validation/bin/python -m pip install jsonschema
      - run: build/schema-validation/bin/python -B scripts/check.py
      - uses: actions/cache/restore@v6.1.0
        with:
          path: |
            IntegrationAuthority/build/seed
            IntegrationAuthority/build/swiftpm
            IntegrationTests/build/seed
            IntegrationTests/build/swiftpm
          key: integration-v1-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ hashFiles('IntegrationAuthority/configs/bcr_authority.lock.json', 'IntegrationTests/configs/surface_plugins.lock.json', 'IntegrationAuthority/configs/authority_source_manager.py') }}-${{ github.sha }}
          restore-keys: integration-v1-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ hashFiles('IntegrationAuthority/configs/bcr_authority.lock.json', 'IntegrationTests/configs/surface_plugins.lock.json', 'IntegrationAuthority/configs/authority_source_manager.py') }}-
      - run: build/schema-validation/bin/python -B scripts/check_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ runner.os }}-${{ github.sha }}
          path: build/j5-integration
      - uses: actions/cache/save@v6.1.0
        if: success() && github.event_name == 'push'
        with:
          path: |
            IntegrationAuthority/build/seed
            IntegrationAuthority/build/swiftpm
            IntegrationTests/build/seed
            IntegrationTests/build/swiftpm
          key: integration-v1-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ hashFiles('IntegrationAuthority/configs/bcr_authority.lock.json', 'IntegrationTests/configs/surface_plugins.lock.json', 'IntegrationAuthority/configs/authority_source_manager.py') }}-${{ github.sha }}
      - uses: actions/cache/save@v6.1.0
        if: success() && github.event_name == 'push'
        with:
          path: build/swiftpm
          key: swiftpm-${{ runner.os }}-${{ env.SWIFT_ID }}-${{ github.sha }}
